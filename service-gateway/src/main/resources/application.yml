server:
  # 网关对外暴露的单一端口：外部用户只访问这一个地址
  port: 8080

spring:
  application:
    name: service-gateway
  cloud:
    # Nacos 服务发现：网关自身注册到 Nacos，并从中发现后端微服务
    nacos:
      discovery:
        server-addr: rxs:8848
        # Nacos 已开启认证（见 nacos.md），客户端注册/查询需带上用户名密码
        username: nacos
        password: 123456
    gateway:
      # Spring Boot 4 下 servlet(webmvc) 风味的网关，配置根为 spring.cloud.gateway.server.webmvc
      server:
        webmvc:
          routes:
            # 用户管理业务 -> service-system（通过 Nacos 服务发现 + 负载均衡，不再写死地址）
            - id: route-service-system
              uri: lb://service-system
              predicates:
                - Path=/api/sys-user/**
            # 认证 / 令牌业务 -> service-auth
            - id: route-service-auth
              uri: lb://service-auth
              predicates:
                - Path=/api/auth/**
            # 订单业务 -> service-order（订单服务内部会通过 Feign 再调用 service-system）
            - id: route-service-order
              uri: lb://service-order
              predicates:
                - Path=/api/order/**
            # 商品业务 -> service-order（商品暂与订单同库同服务）
            - id: route-service-product
              uri: lb://service-order
              predicates:
                - Path=/api/product/**

# 说明：
# 1. 路径前缀（/api/sys-user、/api/auth）会原样转发给后端服务，后端 Controller 也用同样的路径，
#    因此不需要做路径重写（RewritePath）。
# 2. uri 使用 lb://<服务名> 形式：lb 表示走 Spring Cloud LoadBalancer，<服务名> 即各服务的
#    spring.application.name（service-system / service-auth），由 Nacos 注册中心提供实例列表并做负载均衡。
# 3. 前提：service-system / service-auth 已引入 Nacos  discovery 并成功注册到 rxs:8848。
# 4. 网关默认会透传请求头（含 Authorization/token），后续可在网关层统一做鉴权、限流、跨域（CORS）。
