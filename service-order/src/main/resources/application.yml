server:
  # 订单服务端口（service-system=8081 / service-auth=8082 / service-gateway=8080）
  port: 8083

spring:
  application:
    name: service-order
  cloud:
    nacos:
      # Nacos 已开启认证（见 nacos.md），discovery 与 config 共用账号密码
      discovery:
        server-addr: rxs:8848
        username: nacos
        password: 123456
      # 配置中心：datasource 等外部化配置从 Nacos 拉取（dataId=service-order.yaml）
      config:
        server-addr: rxs:8848
        username: nacos
        password: 123456
        file-extension: yaml
        group: DEFAULT_GROUP
    # ★ Sentinel 流量治理（限流 / 熔断 / 降级）
    sentinel:
      transport:
        # 控制台地址：本服务把实时指标报给这个 Dashboard，并从它接收动态下发的规则。
        # Dashboard 部署在局域网 rxs 的 Docker 里（见 sentinel-dashboard.md），端口 8858。
        dashboard: rxs:8858
        # 本服务本地用于接收 Dashboard 下发规则的端口（默认 8719 即可，多个实例需各自区分）
        port: 8719
    # ★ OpenFeign 全局配置
    openfeign:
      client:
        config:
          default:
            # 连接超时：建立 TCP 连接的时间上限。Nacos 返回的实例若已下线，
            # 没有这个超时就会长时间挂住（默认值偏长），导致下单接口迟迟不返回。
            connect-timeout: 3000
            # 读取超时：等待下游响应的上限
            read-timeout: 5000
            # Feign 日志级别：NONE / BASIC / HEADERS / FULL。
            # BASIC 只记录请求方法、URL、状态码与耗时，调试够用且不会把请求体（可能含敏感信息）打进日志。
            logger-level: basic
  # 从 Nacos 配置中心导入 datasource（含 jdbc:mysql url、用户名、密码），不在本地硬编码
  config:
    import:
      - nacos:service-order.yaml
  sql:
    init:
      # never：真实 MySQL 环境不自动建表，避免每次启动 DROP 掉业务数据；
      # 首次部署请手动执行本模块的 schema.sql（见文件内说明）。
      mode: never
      schema-locations: classpath:schema.sql

# ============================ 跨域（CORS）· 仅开发直连时开启 ============================
# 微服务惯例：CORS 统一配置在网关（见 service-gateway 的 CorsConfig），后端服务不参与跨域。
# 只有需要「不经网关、用浏览器页面直连本服务 :8083 调试」时，才把下面两行取消注释。
# ⚠️ 千万不要与网关的 CORS 同时生效：请求经网关转发时两边各写一遍响应头，
#    客户端会收到两个 Access-Control-Allow-Origin，浏览器直接拒绝该响应。
# app:
#   cors:
#     direct-enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
    # 本服务的 ID 只有两个来源，没有第三种：
    #   · 表主键（biz_order / biz_product / biz_order_item）：交给 MySQL 自增，见本行 id-type: auto；
    #   · 订单号 orderNo：由 service-id-gen 批发号段、本服务在内存里发号，
    #     见 support/SegmentIdGenerator 与 support/OrderNoGenerator。
    #
    # 号段模式的唯一性来自 MySQL leaf_alloc 那一行的行锁，与实例身份完全无关：
    # 多实例部署时不需要为任何实例分配 ID 相关的环境变量，
    # 起几个实例、在哪台机器上起，代码和配置都完全一样。

# ============================ 号段发号（service-id-gen） ============================
app:
  id-gen:
    # 本服务在号段账本 leaf_alloc 里的业务标签，必须与那里的种子行 biz_tag 完全一致。
    # 这个值会在启动时打进日志（SegmentIdGenerator 构造器），配错了启动日志里就能看见，
    # 不至于等到第一次下单才报「bizTag 未初始化」。
    biz-tag: order
    # 启动时先把「当前段 + 预备段」领回内存（见 support/IdGenWarmUpRunner）。
    # 关掉它服务照样能发号（首次下单时懒加载），区别只是第一单要等一次 Feign 往返。
    # 这也是为什么它不写成 @PostConstruct：那时 Feign / 负载均衡 / Nacos 都还没就绪。
    warm-up-on-startup: true

logging:
  level:
    # Feign 的日志 logger 名就是 Feign 客户端接口的全限定名。
    # 只把 logger-level 配成 basic 还不够，必须同时把该接口所在包的日志级别设为 debug，
    # 否则 Feign 的日志会被日志框架过滤掉，看不到任何输出。
    com.jwy.scd.api.SysUserApi: debug
    # 领段会走 Feign 调 service-id-gen。排查「多久领一次号段」时打开下面这行，
    # 能看到每次 /api/id/segment 的耗时（正常情况下几秒到几分钟才一次）
    # com.jwy.scd.api.idgen.IdGenApi: debug
    # 想看本地双 buffer 的状态（预取是否成功、何时换段）打开下面这行
    # com.jwy.scd.support.SegmentIdGenerator: debug
