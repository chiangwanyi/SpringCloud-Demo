server:
  port: 8082

spring:
  application:
    name: service-auth
  cloud:
    nacos:
      # Nacos 已开启认证（见 nacos.md），discovery 需带上用户名密码
      discovery:
        server-addr: rxs:8848
        username: nacos
        password: 123456
    # ★ OpenFeign 全局配置
    openfeign:
      client:
        config:
          default:
            # 连接超时：建立 TCP 连接的时间上限。service-system 若未启动/下线，
            # 没有这个超时就会长时间挂住，导致登录接口迟迟不返回。
            connect-timeout: 3000
            # 读取超时：等待下游响应的上限
            read-timeout: 5000
            # Feign 日志级别：NONE / BASIC / HEADERS / FULL。
            # BASIC 只记录请求方法、URL、状态码与耗时，调试够用且不会把请求体（可能含密码）打进日志。
            logger-level: basic

logging:
  level:
    # Feign 的日志 logger 名就是 Feign 客户端接口的全限定名。
    # 只把 logger-level 配成 basic 还不够，必须同时把该接口所在包的日志级别设为 debug，
    # 否则 Feign 的日志会被日志框架过滤掉，看不到任何输出。
    com.jwy.scd.api.SysUserApi: debug

# 说明：
# 1. 本服务为无状态认证服务：不连数据库（无 mybatis / mysql 依赖）、不保存账号密码，
#    因此也不再从 Nacos 配置中心拉取 datasource（不再需要 service-auth.yaml）。
# 2. 登录时通过 Feign 调用 service-system 的 /api/sys-user/verify-password 校验凭据，
#    校验通过后仅签发内存令牌（TokenService，30 分钟过期）。
