server:
  port: 8082

spring:
  application:
    name: service-auth
  cloud:
    nacos:
      # Nacos 已开启认证（见 nacos.md），discovery 与 config 共用账号密码
      discovery:
        server-addr: rxs:8848
        username: nacos
        password: 123456
      # 配置中心：datasource 等外部化配置从 Nacos 拉取（dataId=service-auth.yaml）
      config:
        server-addr: rxs:8848
        username: nacos
        password: 123456
        file-extension: yaml
        group: DEFAULT_GROUP
  # 从 Nacos 配置中心导入 datasource（含 jdbc:mysql url、用户名、密码），不在本地硬编码
  config:
    import:
      - nacos:service-auth.yaml
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
