# 端到端验证专用外部配置（不属于交付物，仅用于本次验证）
# 用途：在网关原有 4 条路由之外追加一条指向本地「回显服务」的路由，
#       用于验证网关注入的 X-User-Id / X-Username / X-User-Nickname 是否真的转发到了下游。
# 注意：列表型配置无法用命令行参数局部追加（会导致列表出现空位而绑定失败），
#       所以这里给出完整列表，通过 --spring.config.additional-location 整体覆盖。
spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: route-service-system
              uri: lb://service-system
              predicates:
                - Path=/api/sys-user/**
            - id: route-service-auth
              uri: lb://service-auth
              predicates:
                - Path=/api/auth/**
            - id: route-service-order
              uri: lb://service-order
              predicates:
                - Path=/api/order/**
            - id: route-service-product
              uri: lb://service-order
              predicates:
                - Path=/api/product/**
            - id: route-echo
              uri: http://127.0.0.1:9099
              predicates:
                - Path=/api/echo/**
