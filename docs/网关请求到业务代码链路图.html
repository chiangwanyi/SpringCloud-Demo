<svg viewBox="0 0 680 560" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>网关请求从 TokenAuthFilter 到业务代码的链路</title>
<desc>展示 filterChain.doFilter 之后请求如何经由 DispatcherServlet 的网关路由处理器转发到后端业务服务</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" font-family="sans-serif" font-size="13" fill="#888780">service-gateway（WebMVC 网关，端口 8080）</text>

<g class="c-blue">
<rect x="40" y="48" width="600" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">TokenAuthFilter（鉴权通过）</text>
<text x="340" y="90" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">filterChain.doFilter(wrapper, response)</text>
</g>

<line x1="340" y1="104" x2="340" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-gray">
<rect x="40" y="132" width="600" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">其余 Servlet Filter 链</text>
</g>

<line x1="340" y1="176" x2="340" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="40" y="204" width="600" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">DispatcherServlet（Servlet 容器末端）</text>
<text x="340" y="246" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">按 URL 找 Handler 处理器</text>
</g>

<line x1="340" y1="260" x2="340" y2="288" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="40" y="288" width="600" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">网关路由处理器（Gateway HandlerMapping）</text>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Path predicate 匹配 → 选中 route，lb:// 负载均衡</text>
</g>

<line x1="340" y1="344" x2="340" y2="372" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-amber">
<rect x="40" y="372" width="600" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="394" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">HTTP 转发到后端（Nacos 实例 + LoadBalancer）</text>
<text x="340" y="414" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">枚举 wrapper 上的请求头 → X-User-Id / X-Username 一起透传</text>
</g>

<line x1="340" y1="428" x2="340" y2="456" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-coral">
<rect x="40" y="456" width="600" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="478" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">后端业务服务（service-order / system / auth）</text>
<text x="340" y="498" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">@RestController 方法，用 @RequestHeader 取身份</text>
</g>
</svg>
