<svg viewBox="0 0 680 520" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>微服务网关鉴权与单体 Security 鉴权的位置对比</title>
<desc>展示请求在微服务架构中于网关统一鉴权，与单体应用中每个服务各自鉴权的区别</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" font-size="15" font-weight="500" fill="#26215C">客户端</text>
<rect x="40" y="44" width="120" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="100" y="66" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">浏览器 / App</text>

<text x="260" y="30" font-size="15" font-weight="500" fill="#0F6E56">网关（唯一入口）</text>
<rect x="240" y="44" width="200" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">Gateway</text>
<text x="340" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">统一鉴权 · 这里做</text>

<line x1="160" y1="66" x2="240" y2="66" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="150" font-size="13" font-weight="500" fill="#5F5E5A">下游服务（不重复鉴权）</text>

<rect x="40" y="164" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="115" y="186" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">service-auth</text>
<text x="115" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">登录 / 发令牌</text>

<rect x="220" y="164" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="295" y="186" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">service-order</text>
<text x="295" y="204" text-anchor="middle" dominant-baseline="204" font-size="12" fill="#3B6D11">订单</text>

<rect x="400" y="164" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="475" y="186" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#173404">service-system</text>
<text x="475" y="204" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3B6D11">用户</text>

<line x1="340" y1="104" x2="115" y2="164" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="104" x2="295" y2="164" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="104" x2="475" y2="164" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="252" width="600" height="26" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="265" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">对照：单体应用（Spring Security 在这里）</text>

<rect x="40" y="296" width="120" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="100" y="318" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#26215C">浏览器</text>

<rect x="240" y="296" width="200" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="316" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#4A1B0C">单体应用</text>
<text x="340" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">Spring Security 拦截</text>

<line x1="160" y1="318" x2="240" y2="318" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="500" y="296" width="120" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="560" y="318" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">登录页</text>
<text x="560" y="336" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">会话 Session</text>

<line x1="440" y1="326" x2="500" y2="326" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="404" width="600" height="96" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="428" font-size="13" font-weight="500" fill="#412402">一句话总结</text>
<text x="60" y="452" font-size="13" fill="#633806">网关鉴权 = 「在门口验一次票」，进来后各服务默认信任，不再重复验证</text>
<text x="60" y="476" font-size="13" fill="#633806">Spring Security = 「每个房间都装锁」，即使在一个进程内也要层层校验</text>
</svg>
